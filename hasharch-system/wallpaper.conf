# cava config feeding the desktop wallpaper visualizer.
# Emits one ASCII frame per line on stdout: 64 values 0-100 separated by ';'.
[general]
mode = normal
bars = 64
framerate = 60
autosens = 1
# lift quiet passages so the bars always have something to show
sensitivity = 180

[smoothing]
# monstercat spreads energy to neighbouring bars => one flowing wave, not dots
monstercat = 1.3
waves = 0
# lower = snappier / more reactive / more accurate to the beat (default 0.77)
noise_reduction = 0.25

[input]
method = pulse
# System audio only (default sink's monitor) — does NOT touch the microphone.
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
channels = mono
